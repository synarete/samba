#
# The smb.conf the cfl_upgrade tests require, in one place.
#
# Both backends of samba.tests.cluster_driver include this file, so that
# a test exercises the same Samba whether it runs against the three node
# cluster selftest builds out of two trees or against real machines with
# packages installed on them.  A difference here would mean a failure
# downstream did not mean what the same failure means upstream.
#
# What belongs in this file: settings which say what the tests see, and
# which are the same wherever the cluster is.  What does not: anything
# naming a path, a host or an identity -- netbios name, realm, share
# paths, the ctdbd socket, private and lock directories -- because those
# are what differs between a selftest prefix and a real machine.  Each
# backend writes those itself.
#
# Included last, so these win over whatever the backend set before, and
# so a share may still override them for itself.
#
# It is not installed. selftest includes it from the source tree, and
# the ssh backend reads it from here and copies it to the nodes itself.
#
# selftest/target/Samba3.pm sets the same values in provision(), for
# every environment rather than only this one.  They agree today; if
# they ever diverge, this file is what the cfl_upgrade tests run with.
#

	read only = no

	smbd:sharedelay = 100000
	smbd:writetimeupdatedelay = 500000
	map hidden = no
	map system = no
	map readonly = no
	store dos attributes = yes
	create mask = 755
	dos filemode = yes
	strict rename = yes
	strict sync = yes
	mangled names = yes

	#
	# fake_acls and xattr_tdb are not a concession to selftest: a test
	# which runs with a different VFS stack is testing a different
	# server.  xattr_tdb opens its store with db_open(), so under
	# clustering it is a ctdb database and the xattrs are the whole
	# cluster's rather than one node's.
	#
	# fake_acls is not in default_shared_modules, see source3/wscript,
	# so a stock package will not have it and smbd will refuse the
	# share.  Build it in, or override this line from the downstream
	# config the generated smb.conf includes at its end.
	#
	vfs objects = acl_xattr fake_acls xattr_tdb streams_depot time_audit full_audit

	full_audit:syslog = no
	full_audit:success = none
	full_audit:failure = none

	#
	# A rolling upgrade runs two Samba versions in one cluster, and
	# smbd_claim_version() refuses to start a node whose version
	# differs from the one already claimed: it takes a write lock,
	# blocks for 60 seconds and then exits with
	# NT_STATUS_SXS_VERSION_CONFLICT, never reaching daemon_ready() and
	# so never opening a socket.
	#
	allow unsafe cluster upgrade = yes
